---
- name: Converge
  hosts: all
  pre_tasks:
    - name: Create TLS directory
      ansible.builtin.file:
        path: /etc/vector/tls
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Create vector group for TLS file access
      ansible.builtin.group:
        name: vector
        system: true
        state: present

    - name: Create vector user for TLS file access
      ansible.builtin.user:
        name: vector
        group: vector
        system: true
        create_home: false
        shell: /sbin/nologin
        state: present

    - name: Create Molecule test CA certificate
      ansible.builtin.command:
        argv:
          - openssl
          - req
          - -x509
          - -newkey
          - rsa:2048
          - -nodes
          - -keyout
          - /etc/vector/tls/ubelix-ca.key
          - -out
          - /etc/vector/tls/ubelix-ca.pem
          - -days
          - '7'
          - -subj
          - /CN=Molecule Vector Test CA
      args:
        creates: /etc/vector/tls/ubelix-ca.pem

    - name: Create Molecule test host key and CSR
      ansible.builtin.command:
        argv:
          - openssl
          - req
          - -new
          - -newkey
          - rsa:2048
          - -nodes
          - -keyout
          - /etc/vector/tls/molecule-test.key
          - -out
          - /etc/vector/tls/molecule-test.csr
          - -subj
          - /CN=molecule-test
      args:
        creates: /etc/vector/tls/molecule-test.csr

    - name: Create Molecule test host certificate
      ansible.builtin.command:
        argv:
          - openssl
          - x509
          - -req
          - -in
          - /etc/vector/tls/molecule-test.csr
          - -CA
          - /etc/vector/tls/ubelix-ca.pem
          - -CAkey
          - /etc/vector/tls/ubelix-ca.key
          - -CAcreateserial
          - -out
          - /etc/vector/tls/molecule-test.pem
          - -days
          - '7'
      args:
        creates: /etc/vector/tls/molecule-test.pem

    - name: Remove temporary Molecule TLS signing files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/vector/tls/ubelix-ca.key
        - /etc/vector/tls/molecule-test.csr
        - /etc/vector/tls/ubelix-ca.srl

    - name: Set Molecule TLS file permissions
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - path: /etc/vector/tls/ubelix-ca.pem
          owner: root
          group: root
          mode: '0644'
        - path: /etc/vector/tls/molecule-test.pem
          owner: root
          group: root
          mode: '0644'
        - path: /etc/vector/tls/molecule-test.key
          owner: vector
          group: vector
          mode: '0600'

  roles:
    - role: ubelix.vector
      vars:
        vector_role: sender
        vector_aggregator_address: "log.example.com:9000"
        vector_ca_file: "/etc/vector/tls/ubelix-ca.pem"
        vector_cert_file: "/etc/vector/tls/molecule-test.pem"
        vector_key_file: "/etc/vector/tls/molecule-test.key"
